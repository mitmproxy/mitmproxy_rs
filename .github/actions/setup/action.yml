name: 'setup'
description: 'checkout, setup rust and python'
inputs:
  rust-version:
    description: 'Rust version'
    required: true
    default: 'stable'
  extra-targets:
    description: 'Extra Rust targets'
  toolchain-args:
    description: 'Extra args for `rustup toolchain`'
runs:
  using: "composite"
  steps:
    - uses: mhils/workflows/setup-python@e6b54c0368640a2201137f00272b978b51d26268
    - run: rustup toolchain install ${{ inputs.rust-version }} --profile minimal ${{ inputs.toolchain-args }}
      shell: bash
    - if: runner.os == 'Linux'
      run: rustup toolchain install nightly --component rust-src
      shell: bash
    - run: rustup default ${{ inputs.rust-version }}
      shell: bash
    - if: inputs.extra-targets
      run: rustup target add ${{ inputs.extra-targets }}
      shell: bash
    - uses: mhils/workflows/rust-cache@e6b54c0368640a2201137f00272b978b51d26268
      with:
        key: ${{ inputs.rust-version }} # proxy value for glibc version
    - if: runner.os == 'Linux'
      run: cargo install --locked bpf-linker@0.9.15
      shell: bash
